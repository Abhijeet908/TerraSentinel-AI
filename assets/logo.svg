<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
  </defs>
  <!-- Orbit Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#1E2D44" stroke-width="2"/>
  <ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="url(#gradCyan)" stroke-width="2" stroke-dasharray="8 4" transform="rotate(-25 50 50)"/>

  <!-- Earth Globe Body -->
  <circle cx="50" cy="50" r="28" fill="#0B111E" stroke="#1E2D44" stroke-width="2"/>
  <!-- Continents stylized -->
  <path d="M 36 34 Q 44 30 52 38 Q 48 46 42 46 Z" fill="url(#gradGreen)" opacity="0.85"/>
  <path d="M 54 48 Q 62 44 68 52 Q 62 62 52 58 Z" fill="url(#gradGreen)" opacity="0.85"/>
  <path d="M 38 52 Q 46 54 48 64 Q 40 68 36 60 Z" fill="url(#gradGreen)" opacity="0.85"/>

  <!-- Satellite Sensor Node -->
  <circle cx="82" cy="36" r="5" fill="url(#gradCyan)"/>
  <line x1="82" y1="36" x2="54" y2="48" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7"/>
  <!-- Solar panels -->
  <rect x="76" y="24" width="12" height="4" fill="#00E5FF" rx="1"/>
  <rect x="76" y="44" width="12" height="4" fill="#00E5FF" rx="1"/>
  <line x1="82" y1="28" x2="82" y2="44" stroke="#00B0FF" stroke-width="2"/>

  <!-- Sentinel Crosshairs -->
  <circle cx="50" cy="50" r="3" fill="#FF1744"/>
</svg>
